name: Build and release Fabric mods

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  skin-tools:
    name: Build Fabric mods
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build skin_tools
        working-directory: skin_tools
        run: ./gradlew clean build

      - name: Build visitor_protection
        working-directory: visitor_protection
        run: ../skin_tools/gradlew clean build

      - name: Prepare release jars
        run: |
          mkdir -p dist
          cp "$(find skin_tools/build/libs -maxdepth 1 -type f -name 'skin-tools-*.jar' ! -name '*-sources.jar' -print -quit)" dist/skin-tools.jar
          cp "$(find visitor_protection/build/libs -maxdepth 1 -type f -name 'visitor-protection-*.jar' ! -name '*-sources.jar' -print -quit)" dist/visitor-protection.jar

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: fabric-mods
          path: dist/*.jar

      - name: Release tagged build
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
          TAG_NAME: ${{ github.ref_name }}
        run: |
          gh release create "$TAG_NAME" \
            dist/skin-tools.jar \
            dist/visitor-protection.jar \
            --repo "$GITHUB_REPOSITORY" \
            --title "$TAG_NAME" \
            --notes "Automated Fabric mod build for $TAG_NAME."
